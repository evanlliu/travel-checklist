<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7fb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Travel List" />
  <title>Travel Checklist</title>
  <link rel="manifest" href="manifest.json?v=1.4.9" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/style.css?v=1.4.9" />
</head>
<body>
  <main id="loginScreen" class="login-screen" hidden>
    <section class="login-card">
      <div class="brand-mark">✓</div>
      <h1 data-i18n="loginTitle">旅行清单</h1>
      <p data-i18n="loginSubtitle">设置 Cloudflare Worker 地址和访问密码后，会直接同步 data.json。</p>
      <form id="loginForm" autocomplete="on">
        <label for="workerUrlInput" data-i18n="workerUrl">Cloudflare Worker 地址</label>
        <input id="workerUrlInput" type="url" inputmode="url" autocomplete="url" data-i18n-placeholder="workerUrlPlaceholder" placeholder="https://你的worker地址.workers.dev" required />
        <label for="passwordInput" data-i18n="password">访问密码</label>
        <input id="passwordInput" type="password" inputmode="text" autocomplete="current-password" required />
        <button type="submit" class="primary-btn" data-i18n="login">保存并同步</button>
      </form>
      <p id="loginStatus" class="helper-text" hidden></p>
      <p class="helper-text" data-i18n="loginTip">第一次使用需要手动填写；同步成功后会写入 data.json，其他设备可自动读取。请使用专用密码，不要使用重要账号密码。</p>
    </section>
  </main>

  <main id="appShell" class="app-shell" hidden>
    <header class="topbar">
      <div class="brand-row">
        <p class="eyebrow"><span data-i18n="appEyebrow">Travel Checklist</span><span id="appVersionBadge" class="version-badge">v1.4.9</span></p>
      </div>
      <div class="header-controls">
        <div class="checklist-switcher" aria-label="Checklist selector">
          <select id="checklistSelect"></select>
        </div>
        <div class="top-actions action-menu-wrap">
          <button id="actionsMenuBtn" class="ghost-btn menu-toggle" type="button" aria-expanded="false" aria-controls="actionsMenu" data-i18n="menu">菜单</button>
          <div id="actionsMenu" class="actions-menu" hidden>
            <button id="manageChecklistBtn" class="ghost-btn" type="button" data-i18n="manageChecklists">管理清单</button>
            <button id="settingsBtn" class="ghost-btn" type="button" data-i18n="settings">设置</button>
          </div>
        </div>
      </div>
    </header>

    <section class="status-row" aria-live="polite">
      <button class="stat-card all" type="button" data-stat-filter="all">
        <span id="statAll">0</span>
        <small data-i18n="all">全部</small>
      </button>
      <button class="stat-card urgent" type="button" data-stat-filter="need_buy">
        <span id="statNeedBuy">0</span>
        <small data-i18n="needBuy">待购买</small>
      </button>
      <button class="stat-card" type="button" data-stat-filter="to_pack">
        <span id="statToPack">0</span>
        <small data-i18n="toPack">待打包</small>
      </button>
      <button class="stat-card open" type="button" data-stat-filter="active">
        <span id="statOpen">0</span>
        <small data-i18n="active">未完成</small>
      </button>
      <button class="stat-card done" type="button" data-stat-filter="done">
        <span id="statDone">0</span>
        <small data-i18n="done">已完成</small>
      </button>
    </section>

    <section class="filter-area">
      <section class="quick-controls">
        <button id="filterToggleBtn" class="ghost-btn filter-toggle" type="button" aria-expanded="false" aria-controls="filterPanel">
          <span data-i18n="queryConditions">查询条件</span>
          <small id="filterSummary"></small>
        </button>
      </section>

      <section id="filterPanel" class="filter-panel" hidden>
        <section class="toolbar">
          <div class="search-box">
            <span>⌕</span>
            <input id="searchInput" type="search" data-i18n-placeholder="searchPlaceholder" placeholder="搜索物品 / 备注" />
          </div>
          <select id="categoryFilter" aria-label="Category filter"></select>
          <button id="clearFilterBtn" class="filter-clear-btn" type="button" data-i18n="clearFilters">清空</button>
        </section>

        <nav id="filterTabs" class="tabs" aria-label="Filters">
          <button class="tab active" data-filter="active" type="button" data-i18n="active">未完成</button>
          <button class="tab" data-filter="need_buy" type="button" data-i18n="needBuy">待购买</button>
          <button class="tab" data-filter="to_pack" type="button" data-i18n="toPack">待打包</button>
          <button class="tab" data-filter="must" type="button" data-i18n="must">必须</button>
          <button class="tab" data-filter="done" type="button" data-i18n="done">已完成</button>
          <button class="tab" data-filter="all" type="button" data-i18n="all">全部</button>
        </nav>
      </section>
    </section>

    <section id="saveStatus" class="save-status" aria-live="polite"></section>
    <section id="itemList" class="item-list"></section>
    <section id="emptyState" class="empty-state" hidden>
      <div>🧳</div>
      <h2 data-i18n="emptyTitle">没有找到物品</h2>
      <p data-i18n="emptySubtitle">换一个筛选条件，或者新增一个清单物品。</p>
    </section>

    <section id="floatingActionDock" class="floating-action-dock" aria-label="Quick actions">
      <button id="floatingAddBtn" class="dock-btn dock-add" type="button" aria-label="新增" title="新增">
        <span class="dock-icon dock-plus">+</span>
      </button>
      <button id="syncBtn" class="dock-btn dock-sync" type="button" aria-label="同步" title="同步">
        <span class="dock-icon dock-sync-icon">↻</span>
      </button>
      <button id="langToggleBtn" class="dock-btn dock-lang" type="button" aria-label="切换语言" title="切换语言">
        <span class="dock-icon dock-lang-icon"><span>A</span><span>文</span></span>
      </button>
    </section>
  </main>

  <div id="itemModal" class="modal-backdrop" hidden>
    <section class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 id="modalTitle" data-i18n="addItem">新增物品</h2>
        <button class="icon-btn close-modal" type="button" aria-label="Close">×</button>
      </div>
      <form id="itemForm" class="item-form">
        <input id="editingItemId" type="hidden" />
        <label>
          <span data-i18n="itemName">物品名称</span>
          <input id="itemTitle" type="text" required maxlength="80" />
        </label>
        <div class="form-grid two type-category-grid">
          <label class="item-type-field">
            <span data-i18n="itemType">类型</span>
            <select id="itemType"></select>
          </label>
          <label class="item-category-field">
            <span data-i18n="category">分类</span>
            <select id="itemCategory"></select>
          </label>
        </div>
        <div class="form-grid two">
          <label>
            <span data-i18n="priority">重要性</span>
            <select id="itemPriority"></select>
          </label>
          <label>
            <span data-i18n="quantity">数量</span>
            <input id="itemQuantity" type="number" min="1" step="1" value="1" />
          </label>
        </div>
        <label>
          <span data-i18n="note">备注</span>
          <textarea id="itemNote" rows="3" maxlength="300"></textarea>
        </label>
        <label class="pin-checkbox-row">
          <input id="itemPinned" type="checkbox" />
          <span data-i18n="pinOnForm">置顶显示</span>
        </label>
        <div class="modal-actions">
          <button class="ghost-btn close-modal" type="button" data-i18n="cancel">取消</button>
          <button class="primary-btn" type="submit" data-i18n="save">保存</button>
        </div>
      </form>
    </section>
  </div>

  <div id="checklistModal" class="modal-backdrop" hidden>
    <section class="modal-sheet wide" role="dialog" aria-modal="true" aria-labelledby="checklistManagerTitle">
      <div class="modal-header">
        <h2 id="checklistManagerTitle" data-i18n="checklistManagerTitle">清单管理</h2>
        <button class="icon-btn close-checklists" type="button" aria-label="Close">×</button>
      </div>

      <form id="newChecklistForm" class="item-form checklist-create-form">
        <div class="setting-section-title" data-i18n="createChecklist">新建清单</div>
        <label>
          <span data-i18n="checklistName">清单名称</span>
          <input id="checklistName" type="text" maxlength="80" data-i18n-placeholder="checklistNamePlaceholder" placeholder="例如：土耳其出行" />
        </label>
        <div class="form-grid two">
          <label>
            <span data-i18n="checklistType">清单类型</span>
            <select id="checklistType"></select>
          </label>
          <label>
            <span data-i18n="createMode">创建方式</span>
            <select id="createMode"></select>
          </label>
        </div>
        <button class="primary-btn full-width" type="submit" data-i18n="createChecklist">新建清单</button>
      </form>

      <div class="checklist-manager-section">
        <h3 data-i18n="activeChecklists">使用中</h3>
        <div id="activeChecklistList" class="checklist-card-list"></div>
      </div>

      <div class="checklist-manager-section">
        <h3 data-i18n="archivedChecklists">已归档</h3>
        <div id="archivedChecklistList" class="checklist-card-list"></div>
      </div>

      <p id="checklistStatus" class="settings-status" hidden></p>
    </section>
  </div>

  <div id="settingsModal" class="modal-backdrop" hidden>
    <section class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="modal-header">
        <h2 id="settingsTitle" data-i18n="settings">设置</h2>
        <button class="icon-btn close-settings" type="button" aria-label="Close">×</button>
      </div>
      <div class="settings-list">
        <label class="setting-row switch-row">
          <span data-i18n="hideDone">默认隐藏已完成</span>
          <input id="hideDoneSwitch" type="checkbox" />
        </label>
        <label class="setting-row switch-row">
          <span data-i18n="showCategoryOnMain">主页面显示分类</span>
          <input id="showCategoryOnMainSwitch" type="checkbox" />
        </label>
        <label class="setting-row switch-row">
          <span data-i18n="showCategoryInEditor">编辑页面显示填写分类</span>
          <input id="showCategoryInEditorSwitch" type="checkbox" />
        </label>
        <div class="setting-section-title" data-i18n="connectionSettings">Cloudflare 同步配置</div>
        <label class="setting-row setting-column">
          <span data-i18n="workerUrl">Cloudflare Worker 地址</span>
          <input id="settingsWorkerUrl" type="url" inputmode="url" data-i18n-placeholder="workerUrlPlaceholder" placeholder="https://你的worker地址.workers.dev" />
        </label>
        <label class="setting-row setting-column">
          <span data-i18n="password">访问密码</span>
          <input id="settingsPassword" type="password" autocomplete="current-password" />
        </label>
        <button id="saveConnectionBtn" class="primary-btn full-width" type="button" data-i18n="saveConnection">保存配置并重新同步</button>
        <p id="settingsStatus" class="settings-status" hidden></p>
      </div>
    </section>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js?v=1.4.9"></script>
  <script src="js/app.js?v=1.4.9"></script>
</body>
</html>
